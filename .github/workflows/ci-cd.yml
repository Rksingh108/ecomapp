
name: E-Commerce Microservices CI/CD

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Maven projects
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pom.xml ]; then
            mvn -B clean verify
          else
            mapfile -t poms < <(
              find . -name pom.xml \
                -not -path '*/target/*' \
                -not -path '*/.git/*'
            )

            if [ "${#poms[@]}" -eq 0 ]; then
              echo "No Maven pom.xml files found."
              exit 1
            fi

            for pom in "${poms[@]}"; do
              echo "Building $pom"
              mvn -B -f "$pom" verify
            done
          fi

  frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

  docker:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' dockerfile; do
            context="$(dirname "$dockerfile")"
            echo "Building image from $dockerfile"

            docker build \
              -f "$dockerfile" \
              "$context"

            count=$((count + 1))
          done < <(
            find . \
              -name Dockerfile \
              -not -path '*/node_modules/*' \
              -not -path '*/target/*' \
              -not -path '*/.git/*' \
              -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "No Dockerfiles found."
            exit 1
          fi
