
name: Smart Kirana CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-kirana-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Test and Deploy
    runs-on: [self-hosted, linux, x64, smart-kirana]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Test User Service
        run: |
          docker run --rm \
            -v "$PWD/user-service:/app" \
            -w /app \
            maven:3.9.9-eclipse-temurin-21 \
            mvn -B clean verify

      - name: Test Product Service
        run: |
          docker run --rm \
            -v "$PWD/product-service:/app" \
            -w /app \
            maven:3.9.9-eclipse-temurin-21 \
            mvn -B clean verify

      - name: Test Order Service
        run: |
          docker run --rm \
            -v "$PWD/order-service:/app" \
            -w /app \
            maven:3.9.9-eclipse-temurin-21 \
            mvn -B clean verify

      - name: Test API Gateway
        run: |
          docker run --rm \
            -v "$PWD/api-gateway:/app" \
            -w /app \
            maven:3.9.9-eclipse-temurin-21 \
            mvn -B clean verify

      - name: Build Docker images
        run: |
          export IMAGE_TAG=${GITHUB_SHA}
          docker compose \
            --env-file /opt/smart-kirana/config/application.env \
            -f deployment/docker-compose.prod.yml \
            build

      - name: Deploy to EC2
        run: |
          chmod +x deployment/deploy.sh
          IMAGE_TAG=${GITHUB_SHA} \
            deployment/deploy.sh

      - name: Deployment status
        if: always()
        run: |
          docker ps -a
